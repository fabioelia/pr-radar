<!doctype html>
<!-- PR Radar's own notification cards, for builds macOS won't deliver
     notifications for (shim.js, useCards). One window in the top-right
     corner holds the stack; it is sized to the cards and hidden when empty. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="ext/theme.css" />
    <style>
      html, body { background: transparent; overflow: hidden; }
      body { font: 13px/1.35 var(--font); color: var(--fg); padding: 10px 14px 16px; display: flex; flex-direction: column; gap: 8px; user-select: none; cursor: default; }
      .card { --tone: var(--accent); position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 11px; padding: 12px 14px 13px 13px; border-radius: 14px; overflow: hidden; cursor: pointer;
        background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(16, 24, 40, 0.16), 0 2px 6px rgba(16, 24, 40, 0.08); animation: enter 0.24s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .card:hover { border-color: var(--border-strong); }
      .card.fail { --tone: var(--danger); }
      .card.pass { --tone: var(--ok); }
      .card.pending { --tone: var(--warn); }
      .card::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--tone); }
      .card.leaving { animation: leave 0.18s ease-in forwards; }
      .icon { width: 34px; height: 34px; border-radius: 9px; }
      .body { min-width: 0; padding-right: 14px; }
      .meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
      .meta .app { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg); }
      .meta .pr { font-weight: 600; color: var(--tone); }
      .title { margin-top: 3px; font-weight: 650; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      ul { margin: 7px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
      li { display: flex; gap: 7px; align-items: baseline; color: var(--muted); }
      li span:last-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); background: var(--subtle); }
      .dot.fail { background: var(--danger); }
      .dot.pass { background: var(--ok); }
      .dot.pending { background: var(--warn); }
      .close { position: absolute; top: 7px; right: 7px; width: 20px; height: 20px; border: 0; border-radius: 50%; padding: 0; display: grid; place-items: center;
        background: var(--surface-3); color: var(--muted); font: 600 13px/1 var(--font); cursor: pointer; opacity: 0; transition: opacity 0.12s; }
      .card:hover .close { opacity: 1; }
      .close:hover { color: var(--fg); }
      .timer { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--tone); opacity: 0.45; transform-origin: left; animation: timer var(--life) linear forwards; }
      .card:hover .timer { animation-play-state: paused; }
      @keyframes enter { from { opacity: 0; transform: translateX(28px); } }
      @keyframes leave { to { opacity: 0; transform: translateX(28px); } }
      @keyframes timer { to { transform: scaleX(0); } }
    </style>
  </head>
  <body>
    <script type="module" src="toast.js"></script>
  </body>
</html>
